<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background shield contour -->
  <path d="M50 8 L85 22 V50 C85 72 50 92 50 92 C50 92 15 72 15 50 V22 Z" 
        fill="#0c1322" stroke="url(#shieldGrad)" stroke-width="3" filter="url(#neonGlow)"/>

  <!-- Inner grid / radar lines -->
  <circle cx="50" cy="48" r="24" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6"/>
  <circle cx="50" cy="48" r="14" fill="none" stroke="#7928ca" stroke-width="1.2" opacity="0.8"/>
  <line x1="50" y1="24" x2="50" y2="72" stroke="#00f2fe" stroke-width="1" opacity="0.4" />
  <line x1="26" y1="48" x2="74" y2="48" stroke="#00f2fe" stroke-width="1" opacity="0.4" />

  <!-- URL link / magnifying node symbol -->
  <path d="M42 42 L58 54 M58 42 L42 54" stroke="url(#glowGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="50" cy="48" r="5" fill="#00f5a0" filter="url(#neonGlow)" />
  <circle cx="38" cy="38" r="3" fill="#00f2fe" />
  <circle cx="62" cy="58" r="3" fill="#7928ca" />
</svg>

